apiVersion: v1
kind: Namespace
metadata:
  name: kube-secret-gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-secret-gateway
  namespace: kube-secret-gateway
data:
  config.yaml: |
    server:
      listenAddress: ":8080"

    metrics:
      listenAddress: ":8081"

    kubernetes:
      defaultNamespace: kube-secret-gateway
      reconcileInterval: 5m

    exposures:
      - name: my-cert
        secretRef:
          name: my-cert
        keys:
          - tls.crt
          - tls.key
        # Replace with the destination host's address, or with the address
        # preserved by a trusted reverse proxy.
        allowedCidrs:
          - 192.0.2.10/32
        auth:
          secretRef:
            name: my-cert-fetcher
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-secret-gateway
  namespace: kube-secret-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-secret-gateway
  namespace: kube-secret-gateway
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["my-cert", "my-cert-fetcher"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-secret-gateway
  namespace: kube-secret-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-secret-gateway
subjects:
  - kind: ServiceAccount
    name: kube-secret-gateway
    namespace: kube-secret-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-secret-gateway
  namespace: kube-secret-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-secret-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-secret-gateway
    spec:
      serviceAccountName: kube-secret-gateway
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          # v0.2.0 is an example release tag. Replace it with the release you
          # want to run; pin its digest in production for full reproducibility.
          image: ghcr.io/kabsdk/kube-secret-gateway:v0.2.0
          imagePullPolicy: IfNotPresent
          args:
            - -config=/etc/kube-secret-gateway/config.yaml
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/kube-secret-gateway
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kube-secret-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: kube-secret-gateway
  namespace: kube-secret-gateway
spec:
  selector:
    app.kubernetes.io/name: kube-secret-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 8081
      targetPort: metrics
