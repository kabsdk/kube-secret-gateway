# /etc/kube-secret-gateway/config.yaml
server:
  listenAddress: ":8080"

metrics:
  listenAddress: ":8081"

kubernetes:
  defaultNamespace: kube-secret-gateway
  reconcileInterval: 5m

exposures:
  # This exposure projects two keys from the my-cert Kubernetes Secret.
  # Replace this documentation address with the destination host's address,
  # or with the address preserved by your trusted reverse proxy.
  - name: my-cert
    secretRef:
      name: my-cert
    keys:
      - tls.crt
      - tls.key
    allowedCidrs:
      - 192.0.2.10/32
    auth:
      secretRef:
        name: my-cert-fetcher
