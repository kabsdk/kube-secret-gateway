# /etc/kube-secret-gateway-agent/config.yaml
gateway:
  url: https://gateway.example.com
  # caFile replaces the system trust store for this connection, rather than
  # adding to it. Use it when the gateway has a private CA.
  caFile: /etc/ssl/certs/internal-ca.crt
  timeout: 30s

# The long-running agent exposes Prometheus metrics here. Restrict this port to
# your Prometheus servers with the host firewall.
metrics:
  listenAddress: 0.0.0.0:9091

exposures:
  - name: my-cert
    auth:
      username: fetcher
      # Read again before every fetch, so rotation needs no agent restart.
      passwordFile: /etc/kube-secret-gateway-agent/my-cert.password
    interval: 24h
    onChangeCommand: [systemctl, reload, nginx]
    targets:
      - key: tls.crt
        path: /etc/ssl/nginx/tls.crt
        mode: "0644"
      - key: tls.key
        path: /etc/ssl/nginx/tls.key
