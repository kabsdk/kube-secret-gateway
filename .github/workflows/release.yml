name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kube-secret-gateway

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            gateway/go.sum
            agent/go.sum

      - name: Validate release tag
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.ref_name }}
        run: |
          identifier='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-${identifier}(\\.${identifier})*)?$"
          if [[ ! "$TAG" =~ $semver ]]; then
            echo "error: release tag must resemble v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

          git fetch --no-tags origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "error: $TAG does not point to a commit on $DEFAULT_BRANCH" >&2
            exit 1
          fi

          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            {
              echo "image_tags<<EOF"
              echo "$IMAGE:$TAG"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            {
              echo "image_tags<<EOF"
              echo "$IMAGE:$TAG"
              echo "$IMAGE:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Vet and test
        run: make check

      - name: Run race detector
        run: make test-race

      - name: Build agent release assets
        env:
          PLATFORMS: linux/amd64 linux/arm64
          SKIP_TESTS: "1"
        run: ./agent/scripts/build-release.sh "$GITHUB_REF_NAME"

      - name: Verify release checksums
        working-directory: agent/dist
        run: sha256sum --check SHA256SUMS

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and publish gateway image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.image_tags }}
          labels: |
            org.opencontainers.image.title=Kube Secret Gateway
            org.opencontainers.image.description=Expose selected Kubernetes Secret data through an authenticated HTTP API
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          TAG: ${{ github.ref_name }}
        run: |
          release_flags=(--verify-tag --generate-notes --fail-on-no-commits --title "$TAG")
          if [[ "$PRERELEASE" == true ]]; then
            release_flags+=(--prerelease --latest=false)
          else
            release_flags+=(--latest)
          fi
          gh release create "$TAG" "${release_flags[@]}" agent/dist/*
